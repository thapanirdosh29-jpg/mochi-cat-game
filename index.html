<!DOCTYPE html>
<html>
<head>
<title>Mochi The Cat</title>
<style>
body{
font-family:Arial;
text-align:center;
background:pink;
padding:20px;
}

button{
padding:10px;
margin:5px;
font-size:18px;
}

#cat{
font-size:100px;
}
</style>
</head>
<body>

<h1>🐱 Mochi The Cat</h1>

<div id="cat">😺</div>

<h2>Coins: <span id="coins">100</span></h2>
<h2>Hunger: <span id="hunger">100</span>%</h2>
<button onclick="feed()">🍖 Feed</button>
<button onclick="play()">🎾 Play</button>

<p id="msg">Take care of Mochi!</p>

<script>
let coins = 100;
let hunger = 100;
function feed(){
coins -= 10;
document.getElementById("coins").innerText = coins;
document.getElementById("msg").innerText = "Mochi loved the food!";
}

function play(){
coins += 5;
document.getElementById("coins").innerText = coins;
document.getElementById("msg").innerText = "Mochi had fun!";
}
</script>

</body>
</html>
